<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LENA TRACKER</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header>
      <button id="edit-toggle" class="login-button" type="button">Login</button>
      <h1>LENA TRACKER</h1>
      <div class="header-info">
        <div id="progress">0 / 12</div>
        <div id="countdown">00:00:00</div>
      </div>
    </header>

    <section id="games" class="games"></section>
    <div id="edit-actions" hidden>
      <button id="add-game" class="add-game" type="button" aria-label="Add game">+</button>
      <div class="list-tools">
        <button id="remove-mode" class="bin-button" type="button" aria-pressed="false">Remove</button>
        <button id="open-bin" class="bin-button" type="button" aria-label="Open bin">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7"/></svg>
          <span id="bin-count">0</span>
        </button>
      </div>
    </div>
    <p id="list-status" class="status" role="status"></p>
  </main>

  <dialog id="editor" aria-label="Add game">
    <button class="close-dialog" type="button" data-close="editor" aria-label="Close">×</button>
    <form id="game-form">
      <label for="game-url">LINK</label>
      <input id="game-url" type="url" required>
      <label for="game-title">NAME</label>
      <input id="game-title" type="text" maxlength="200" required>
      <button type="submit">Add game</button>
      <p id="editor-status" class="status" role="status"></p>
    </form>
  </dialog>

  <dialog id="bin-dialog" aria-labelledby="bin-heading">
    <button class="close-dialog" type="button" data-close="bin-dialog" aria-label="Close">×</button>
    <h2 id="bin-heading">Bin</h2>
    <div id="bin-games"></div>
    <p id="bin-status" class="status" role="status"></p>
  </dialog>

  <dialog id="login-dialog" aria-labelledby="login-heading">
    <button class="close-dialog" type="button" data-close="login-dialog" aria-label="Close">×</button>
    <form id="login-form">
      <h2 id="login-heading">Login</h2>
      <label for="edit-pin">4-digit PIN</label>
      <input id="edit-pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" required aria-describedby="login-error">
      <p id="login-error" class="status" role="alert"></p>
      <div class="dialog-actions">
        <button id="cancel-login" type="button" class="secondary">Cancel</button>
        <button type="submit">Login</button>
      </div>
    </form>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
